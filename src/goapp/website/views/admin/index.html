{{ template "base-header.html" . }}
{{ template "header.html" . }}
<app-main>
    <script type="module">
        const megaphone = new Megaphone();
        // TODO: FFS-Csrf-Protection necessary?
        megaphone.declareCsrfCookie('FFS-Csrf-Protection');

        const state = megaphone.declareState({
            message: megaphone.urlParam('message', null),
            hasMessage: megaphone.view((state) => state.message !== null),
            permissions: megaphone.jsonApi('/api/admin/capabilities', {}),
            diskUsage: megaphone.jsonApi('/api/admin/disk-usage', {
                path: '???',
                available: '???',
            }),
            diskMountpoint: megaphone.view((state) => state.diskUsage.path || '???'),
            availableBytesInDisk: megaphone.view((state) => state.diskUsage.available || '???'),
            allowHousekeeping: megaphone.view(
                (state) => state.permissions.allowHousekeeping || false
            ),
            allowHousekeepingVisibility: megaphone.view((state) =>
                state.allowHousekeeping ? 'show' : 'hidden'
            ),
        });

        megaphone.renderIf(
            state.hasMessage,
            '#message-display',
            megaphone.template('#message-template', (clone) => {
                const messageEl = clone.querySelector('.message');
                messageEl.textContent = state.message.value;
                const clsName = state.message.value.toLocaleLowerCase().includes('error')
                    ? 'error'
                    : 'success';
                messageEl.className = `message ${clsName}`;
                return clone;
            })
        );

        megaphone.init();
    </script>

    <app-header>Admin</app-header>
    <section>
        <p>Administrative actions for managing the FFS file server.</p>
        <p>
            Mounted to <span $textContent="diskMountpoint"></span> and
            <span $textContent="availableBytesInDisk"></span> are available.
        </p>
    </section>

    <horizontal-ruler></horizontal-ruler>

    <section $data-visibility="allowHousekeepingVisibility">
        <h2>Thumbnails</h2>
        <p>Remove all cached thumbnail images. These will be regenerated when files are viewed.</p>
        <form action="/api/admin/clear-thumbnails" method="post">
            <fieldset>
                <button type="submit">Clear Thumbnails</button>
            </fieldset>
        </form>
    </section>

    <horizontal-ruler></horizontal-ruler>

    <section id="message-display">
        <template id="message-template">
            <div class="message"></div>
            <style>
                .message {
                    padding: 1rem;
                    margin: 1rem 0;
                    border-radius: 4px;
                    border: 1px solid;
                }
                .message.success {
                    background-color: #d4edda;
                    border-color: #c3e6cb;
                    color: #155724;
                }
                .message.error {
                    background-color: #f8d7da;
                    border-color: #f5c6cb;
                    color: #721c24;
                }
            </style>
        </template>
    </section>
</app-main>
{{ template "base-footer.html" . }}
